---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote1-service
  namespace: development
  labels:
    app: quote1-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quote1-service
  template:
    metadata:
      labels:
        app: quote1-service
    spec:
      containers:
      - name: quote1-container
        image: datawire/quote:0.5.0
        ports:
        - containerPort: 8080